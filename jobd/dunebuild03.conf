# daq-jobd settings for dunebuild03.fnal.gov (Alma 9, 24 CPUs, 92 GB), usable as is by
# anyone: every path is under /exp/dune/app/users/$USER (CephFS; home is a full NFS
# volume). Setup: jobd/README.md, "Native hosts".

MODE=native
HOST_LABEL=dunebuild03.fnal.gov
WORK=/exp/dune/app/users/$USER/daq-jobd/work
JOBS=/exp/dune/app/users/$USER/daq-jobd/jobs

# A shared 24-CPU build machine: two jobs, 12 build threads each. An integtest takes both
# slots: run beside a build, timing-sensitive tests fail on 24 CPUs. 30-CPU tests belong
# on daq.fnal.gov.
MAX_SLOTS=2
INTEGTEST_EXCLUSIVE=all
DEFAULT_JOBS=12

SETUP_ROOT=cd {work} && source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh && setup_dbt latest
SETUP_AREA=cd {work}/{area} && source ./env.sh

MIRROR=/exp/dune/app/users/$USER/dunedaq_repos_mirror
GIT_URL=https://github.com/DUNE-DAQ/{repo}.git
RECIPE_SSH_REPOS=0

# drunc's ssh process manager connects to the host itself, by its full name (Kerberos
# refuses localhost). Accept its host key once: ssh dunebuild03.fnal.gov true
SELF_SSH_HOST=$(hostname -f)
